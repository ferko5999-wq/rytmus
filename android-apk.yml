name: Sestavit APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Stahnout zdrojove soubory
        uses: actions/checkout@v4
      - name: Nastavit JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Nastavit Android SDK
        uses: android-actions/setup-android@v3
      - name: Nainstalovat Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Nastavit Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Sestavit instalacni soubor
        run: gradle --no-daemon assembleDebug
      - name: Nabidnout APK ke stazeni
        uses: actions/upload-artifact@v4
        with:
          name: Rytmus-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
